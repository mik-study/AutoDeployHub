name: autodeploy

services:
  postgres:
    image: postgres:16
    container_name: autodeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autodeploy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rlagustn1!}
    # 로컬에 설치된 PostgreSQL(5432)과 충돌 회피용 호스트 포트(5433).
    # 백엔드 컨테이너는 내부 네트워크 'postgres:5432' 로 접속하므로 영향 없음.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - autodeploy-network

  redis:
    image: redis:7
    container_name: autodeploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autodeploy-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: autodeploy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-autodeploy_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-autodeploy_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - autodeploy-network

  frontend:
    image: node:24.12.0-alpine
    container_name: autodeploy-frontend
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://api.autodeploy.test:8081/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dashboard.autodeploy.test`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
    networks:
      - autodeploy-network

  backend:
    image: eclipse-temurin:21-jdk
    container_name: autodeploy-backend
    working_dir: /app
    restart: unless-stopped
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # application.properties와 동일한 DB 설정을 사용하되, 호스트는 Compose 서비스명으로 지정한다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-autodeploy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rlagustn1!}
      # 컨테이너 내부에서는 서비스명으로 접속 (autodeploy-network 안).
      # application.properties 의 localhost 기본값을 relaxed binding 으로 덮어쓴다.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-autodeploy_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-autodeploy_password}
      # 배포 분산락 (과제 5). 컨테이너 내부에서는 서비스명으로 접속.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 환경변수 암호화 키 (과제 6). 운영에서는 반드시 외부 주입할 것.
      ENV_ENC_KEY: ${ENV_ENC_KEY:-local-dev-env-key-32byte-change!}
    # 의존 인프라가 준비되기 전에 백엔드가 떠서 접속 실패 로그를 뿜는 걸 막는다.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "chmod +x ./gradlew && ./gradlew bootRun --project-cache-dir=/root/.gradle-project-cache --args='--server.port=8080'"]
    volumes:
      - ./backend/autodeploy:/app
      - gradle_cache:/root/.gradle
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.autodeploy.test`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - autodeploy-network

  traefik:
    image: traefik:v3.6.1
    container_name: autodeploy-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=autodeploy-network"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - autodeploy-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
  gradle_cache:

networks:
  autodeploy-network:
    name: autodeploy-network
    driver: bridge
