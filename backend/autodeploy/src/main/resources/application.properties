spring.application.name=autodeploy

# --- DataSource (local PostgreSQL, no Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/autodeploy
spring.datasource.username=postgres
spring.datasource.password=rlagustn1!
# Using a locally installed PostgreSQL, so do NOT auto-start the compose.yaml postgres.
spring.docker.compose.enabled=false

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus
# Graphite server is not available yet, so disable export (enable when monitoring stack is set up).
management.graphite.metrics.export.enabled=false

# --- JWT ---
# In production, always inject via the JWT_SECRET env var (HS256, at least 32 bytes).
jwt.secret=${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-value}
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600

# --- Environment variable encryption (AES-256/GCM) ---
# Must be exactly 16, 24, or 32 bytes in UTF-8. In production always inject via ENV_ENC_KEY.
# Changing this key makes every stored value undecryptable - re-encryption migration required.
env.encryption-key=${ENV_ENC_KEY:local-dev-env-key-32byte-change!}

# --- RabbitMQ ---
# Defaults target a broker on the host. In compose these are overridden by SPRING_RABBITMQ_* env vars
# (Spring Boot relaxed binding), exactly like SPRING_DATASOURCE_URL is.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=autodeploy_user
spring.rabbitmq.password=autodeploy_password

# Handle one message at a time. Preventing concurrent deploys per project is task 5 (Redis lock).
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
# Safety net: if an exception ever escapes the listener, do not requeue it forever. (no DLQ yet)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Redis (deployment distributed lock) ---
# Overridden by SPRING_DATA_REDIS_* env vars in compose, same as the datasource.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Lock mode: "redis" (default) or "in-memory" for single-node local runs and tests.
autodeploy.lock.mode=redis
# Deadlock guard. Must comfortably exceed the longest expected deploy, since a worker that dies
# without releasing leaves the project blocked until this expires.
autodeploy.lock.ttl-seconds=1800

# --- Deploy pipeline (task 3) ---
# "real" runs git/docker CLI; "mock" fakes them so the state machine and SSE can be demoed
# without a docker daemon (see FakeCommandRunner).
autodeploy.pipeline.mode=real
# Subdomain base used for the traefik routing rule: project-{id}.{base-domain}
autodeploy.deploy.base-domain=autodeploy.test
# Deployed containers must share this network with traefik, otherwise routing never resolves.
autodeploy.deploy.network=autodeploy-network
