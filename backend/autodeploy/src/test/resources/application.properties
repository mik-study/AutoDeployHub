spring.application.name=autodeploy-test

# --- Load the context with H2 (PostgreSQL compatibility mode), no external DB/Docker for tests ---
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:autodeploy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# --- Disable metrics export (remove test log noise) ---
management.graphite.metrics.export.enabled=false

# --- JWT (fixed values for tests) ---
jwt.secret=test-secret-key-for-junit-context-load-0123456789abcdef
jwt.access-token-validity-seconds=1800
jwt.refresh-token-validity-seconds=1209600

# --- RabbitMQ (tests never connect to a broker) ---
# Without this, the @RabbitListener container keeps retrying 5672 during context load and floods
# the test log with AmqpConnectException. CachingConnectionFactory itself is lazy, so disabling the
# listener container (plus mocking DeploymentPublisher where publishing is exercised) is enough.
spring.rabbitmq.listener.simple.auto-startup=false

# --- Environment variable encryption (fixed 32-byte key for tests) ---
env.encryption-key=test-env-encryption-key-32bytes!

# --- Deployment lock (tests never connect to Redis) ---
# InMemoryDeploymentLockManager is registered instead of the Redis one, so the 409 duplicate-deploy
# path is still exercised end-to-end without a broker.
autodeploy.lock.mode=in-memory

# --- Deploy pipeline (tests never invoke git or docker) ---
# FakeCommandRunner + AlwaysHealthyChecker are registered instead, so the full state machine
# (CLONING -> ... -> SUCCEEDED) is exercised without external processes.
autodeploy.pipeline.mode=mock
